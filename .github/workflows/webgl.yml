name: WebGL build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build WebGL
    runs-on:
      - self-hosted
      - Linux
      - unity-6000-6-10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build WebGL artifact
        env:
          SPIDERBRO_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SPIDERBRO_DEVELOPMENT_BUILD: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          SPIDERBRO_WEBGL_COMPRESSION: Brotli
        run: ./scripts/build-webgl.sh "$RUNNER_TEMP/Spiderbro-WebGL"

      - name: Package WebGL artifact
        shell: bash
        run: |
          release_name="Spiderbro-WebGL-${GITHUB_REF_NAME//\//-}"
          mkdir -p artifacts
          (cd "$RUNNER_TEMP/Spiderbro-WebGL" && zip -qr "$GITHUB_WORKSPACE/artifacts/$release_name.zip" .)
          echo "RELEASE_ARCHIVE=$release_name.zip" >> "$GITHUB_ENV"

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spiderbro-WebGL
          path: artifacts/${{ env.RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "artifacts/$RELEASE_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" "artifacts/$RELEASE_ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Spiderbro $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
